spring:
  application:
    name: solid
  datasource:
    url: ${SOLID_DB_URL:jdbc:postgresql://localhost:5432/solid}
    username: ${SOLID_DB_USER:solid}
    password: ${SOLID_DB_PASSWORD:solid}
    hikari:
      # Every pooled connection runs as the restricted role so row-level security applies.
      connection-init-sql: SET ROLE solid_app
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 27MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8081
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

solid:
  security:
    # 32 random bytes, base64. Generate with: openssl rand -base64 32
    # Back it up separately from the database: without it, encrypted fields can't be read.
    master-key: ${SOLID_MASTER_KEY}
  ai:
    # Optional help from a model running on this same server (Ollama). Off by default; Solid installs nothing.
    # Only a transaction's description, its amount and this entity's account codes are sent, and the answer can
    # only pick from those accounts. No tax figure ever comes from a model.
    enabled: ${SOLID_AI_ENABLED:false}
    base-url: ${SOLID_AI_BASE_URL:http://localhost:11434}
    model: ${SOLID_AI_MODEL:llama3.2}
    timeout-seconds: ${SOLID_AI_TIMEOUT_SECONDS:8}
  documents:
    # Where uploaded files are stored (encrypted). In Docker this is a volume.
    root: ${SOLID_DOCUMENTS_ROOT:./data/documents}
  auth:
    # When false, only the very first user (the instance admin) can sign up.
    open-signup: ${SOLID_OPEN_SIGNUP:false}
