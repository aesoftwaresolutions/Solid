spring:
  application:
    name: solid
  datasource:
    url: ${SOLID_DB_URL:jdbc:postgresql://localhost:5432/solid}
    username: ${SOLID_DB_USER:solid}
    password: ${SOLID_DB_PASSWORD:solid}
    hikari:
      # Every pooled connection runs as the restricted role so row-level security applies.
      connection-init-sql: SET ROLE solid_app
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8081
  error:
    include-stacktrace: never
