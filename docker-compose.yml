# Local development stack: `docker compose up --build`, then open http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solid
      POSTGRES_USER: solid
      POSTGRES_PASSWORD: ${SOLID_DB_PASSWORD:-solid}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solid -d solid"]
      interval: 5s
      retries: 20

  app:
    build: ./backend
    environment:
      SOLID_DB_URL: jdbc:postgresql://postgres:5432/solid
      SOLID_DB_USER: solid
      SOLID_DB_PASSWORD: ${SOLID_DB_PASSWORD:-solid}
      # Required. Generate once with `openssl rand -base64 32`, put it in .env, and back it up safely.
      SOLID_MASTER_KEY: ${SOLID_MASTER_KEY:?Set SOLID_MASTER_KEY in .env (see .env.example)}
      SOLID_DOCUMENTS_ROOT: /var/lib/solid/documents
    volumes:
      # Uploaded receipts and statements, encrypted with SOLID_MASTER_KEY. Back this up with the database.
      - documents:/var/lib/solid/documents
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - app

volumes:
  pgdata:
  documents:
