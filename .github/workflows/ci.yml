name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test (Testcontainers uses the runner's Docker) and license check
        run: chmod +x mvnw && ./mvnw -B -Plicense-check verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: License check (fail on GPL/AGPL)
        run: npx --yes license-checker-rseidelsohn --production --failOn 'GPL-2.0;GPL-3.0;AGPL-3.0;GPL-2.0-only;GPL-3.0-only;AGPL-3.0-only;GPL-2.0-or-later;GPL-3.0-or-later;AGPL-3.0-or-later'
