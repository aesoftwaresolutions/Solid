name: production-quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test and build
        working-directory: frontend
        run: npm test -- --run && npm run build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed build caches
        run: |
          if git ls-files | grep -E '(^|/)(tsconfig\.tsbuildinfo|.*\.tsbuildinfo)$'; then
            echo 'Generated TypeScript build cache files must not be committed.'
            exit 1
          fi
      - name: Reject obvious committed secrets
        run: |
          if git grep -nE '-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----|AKIA[0-9A-Z]{16}' -- . ':(exclude)docs/*'; then
            echo 'Possible private key or cloud credential committed.'
            exit 1
          fi
